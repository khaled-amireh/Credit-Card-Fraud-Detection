<svg xmlns="http://www.w3.org/2000/svg" width="960" height="320" viewBox="0 0 960 320" role="img" aria-labelledby="title description">
  <title id="title">Fraud Intelligence</title>
  <desc id="description">A static navy and teal illustration of transaction signals converging on a detection point. Decorative artwork, not model output or a live dashboard.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#070d19"/>
      <stop offset="1" stop-color="#0d2030"/>
    </linearGradient>
    <radialGradient id="ambient">
      <stop stop-color="#0e7490" stop-opacity=".24"/>
      <stop offset="1" stop-color="#0e7490" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="signal">
