      <stop offset=".35" stop-color="#22d3ee"/>
      <stop offset=".7" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#5eead4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="edge">
